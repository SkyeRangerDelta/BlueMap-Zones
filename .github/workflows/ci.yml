name: CI

on:
  pull_request:
    branches: ["master", "development"]
  push:
    branches: ["master", "development"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs full history to diff against the base branch
          fetch-depth: 0

      - name: Lint config files
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: development
          VALIDATE_ALL_CODEBASE: false
          # CHANGELOG.md is generated by semantic-release, so its formatting is not
          # ours to fix. It starts at "## <version>", which trips MD041. Excluding it
          # also stops a future release's output from breaking an unrelated PR.
          FILTER_REGEX_EXCLUDE: '(^|/)CHANGELOG\.md$'
          # Java is deliberately not linted yet. super-linter's Java rules are
          # google-java-format, which rejects this codebase's existing style
          # wholesale. Enabling it needs a dedicated reformat pass first.
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This repo is authored on Windows with core.fileMode=false, so the
      # executable bit on gradlew can silently regress in a commit. Redundant
      # when the index has it (100755), cheap insurance when it does not.
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error
